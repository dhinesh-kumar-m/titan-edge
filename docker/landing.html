<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live Flow</title>
<style>
  :root { --bg: #0f1115; --panel: #171a21; --line: #262b36; --text: #e6e9ef; --muted: #9aa3b2; --accent: #4ade80; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
         min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
  .wrap { max-width: 420px; width: 100%; }
  h1 { font-size: 22px; margin: 0 0 24px; font-weight: 600; text-align: center; }
  a.card { display: block; background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
           padding: 18px 20px; margin-bottom: 12px; text-decoration: none; color: var(--text); }
  a.card:hover { border-color: var(--accent); }
  a.card .title { font-weight: 600; margin-bottom: 4px; }
  a.card .desc { color: var(--muted); font-size: 13px; }
</style>
</head>
<body>
  <div class="wrap">
    <h1>Live Flow</h1>
    <a class="card" href="/streams/">
      <div class="title">Active Streams</div>
      <div class="desc">Which streams are live right now, and a link to watch each one.</div>
    </a>
    <a class="card" href="/dashboard/">
      <div class="title">Capacity Over Time</div>
      <div class="desc">How the server has handled load through the test so far.</div>
    </a>
  </div>
</body>
</html>

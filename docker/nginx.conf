# The one web server every viewer talks to.
#
# There is exactly one of these per machine, no matter how many streams are
# running. Each stream container writes its HLS files into its own directory
# under /srv/streams, named after the stream's PLAYBACK ID, and that id appears
# in the public URL - so the URL maps straight onto a directory and nothing has
# to change when a stream is created or ended. Nothing here is reloaded when
# streams come and go.
#
#   http://server/live/{org}/{playback_id}/video.m3u8
#      -> /srv/streams/{playback_id}/data/livestream/video.m3u8
#
# The "data" segment is the per-stream disk-cap mount point (a loop-mounted
# ext4 filesystem sized in titan.py) - the HLS files live inside it, not
# directly under the stream's own directory.
#
# The playback id is public and is NOT the stream key. The stream key is the
# credential that permits publishing and never appears in any URL served here,
# so knowing a playback URL gives no ability to broadcast to that stream.
#
# The stream containers have no web server of their own. Their Django listens
# on the loopback address only, so the endpoints that start and stop
# transcoding cannot be reached from outside the machine at all.

user nginx;
worker_processes 4;
# Must be raised alongside worker_connections below, or nginx caps itself at
# the container default of 1024 open files and warns at startup. Each viewer
# fetching a segment costs a file handle, so this is what limits how many
# people can watch at once.
worker_rlimit_nofile 65536;
pid /var/run/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 4096;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    access_log    /dev/stdout;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout 65;

    # nginx's own mime.types already covers m3u8 and ts; repeating them only
    # produces a duplicate-extension warning. DASH manifests are not in it.
    types {
        application/dash+xml          mpd;
    }

    server {
        listen 80 default_server;
        server_name _;

        add_header Access-Control-Allow-Origin  "*" always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;

        # The patterns below are a security boundary, not tidiness.
        #
        # The id is restricted to characters that cannot form a path, so an id
        # of ".." cannot walk out of /srv/streams and serve arbitrary files.
        #
        # The filename is restricted to what HLS playback actually needs, and
        # deliberately excludes two things that live in the same directory:
        #
        #   video.mp4  - the full-quality recording of the broadcast. Serving
        #                it would let anyone with the playback URL download the
        #                master copy, not just watch the stream.
        #   *.key      - the decryption key for encrypted HLS. Serving the key
        #                next to the video it protects defeats the encryption
        #                entirely. Not used today; excluded so that turning
        #                encryption on later cannot silently publish the keys.

        # Playlists change every few seconds and must never be cached.
        location ~ "^/live/[A-Za-z0-9_-]+/(?<pbid>[A-Za-z0-9_-]{1,64})/(?<pl>video[A-Za-z0-9._-]*\.(m3u8|mpd))$" {
            alias /srv/streams/$pbid/data/livestream/$pl;
            expires -1d;
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header Access-Control-Allow-Origin "*" always;
        }

        # Segments never change once written, so they can be cached hard.
        location ~ "^/live/[A-Za-z0-9_-]+/(?<pbid>[A-Za-z0-9_-]{1,64})/(?<seg>video[A-Za-z0-9._-]*\.ts)$" {
            alias /srv/streams/$pbid/data/livestream/$seg;
            expires max;
            add_header Access-Control-Allow-Origin "*" always;
        }

        location /player/ {
            alias /usr/share/nginx/player/;
            index index.html;
        }

        # A read-only snapshot of which streams are live right now, written by
        # dashboard.py's status-page timer. Nothing here is computed when the
        # page is requested - nginx only ever serves a file that already
        # exists, so viewing this page costs nothing on the server under test.
        #
        # URL is /streams/, not /status/ - a plural noun for a list of things
        # is the ordinary convention, and "status" reads more like a health
        # page than a stream listing. The internal container path stays
        # "status" underneath; only the public URL changed, so nothing else
        # (the sampler, the generator, the compose file) needed touching.
        location /streams/ {
            alias /usr/share/nginx/status/;
            index index.html;
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        }
        location = /status/ { return 302 /streams/; }

        # URL is /dashboard/, not /stats/ - the more usual name for a live
        # metrics page (matches how Grafana, cloud consoles, admin panels
        # all name this kind of page).
        #
        # Prefix location, unlike the "/" block above - index works fine here
        # because a request to /dashboard/index.html still matches this same
        # /dashboard/ prefix, so there is no fall-through to the catch-all.
        location /dashboard/ {
            alias /usr/share/nginx/stats/;
            index index.html;
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        }
        location = /stats/ { return 302 /dashboard/; }

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        # A small landing page rather than redirecting straight to the
        # player, now that there is more than one thing worth finding from
        # here.
        #
        # try_files, not index: the index directive works by internally
        # rewriting the request to /index.html and re-matching it against
        # every location block from scratch. That new URI no longer matches
        # this exact "/" block, so it fell through to the catch-all 404
        # below instead. try_files serves the file inside this same
        # location, with no re-match, so it actually reaches this block.
        location = / {
            alias /usr/share/nginx/landing/;
            try_files index.html =404;
        }

        location / {
            return 404;
        }
    }
}
